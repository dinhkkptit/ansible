---
- name: IOS MAINTASK DOWN snapshot commands
  ansible.builtin.set_fact:
    commands:
      - "show clock"
      - "show etherchannel summary"

- name: Run IOS DOWN snapshot commands
  cisco.ios.ios_command:
    commands: "{{ commands }}"
  register: snap

- name: Save IOS DOWN snapshot text
  ansible.builtin.copy:
    dest: "{{ snapshot_dir }}/{{ inventory_hostname }}_down.{{ snapshot_ext }}"
    content: "{{ snap.stdout | join('\n\n-----\n\n') }}"
  delegate_to: localhost

- name: Write IOS DOWN snapshot CSV
  vars:
    csv_file: "{{ snapshot_dir }}/maintask_{{ inventory_hostname }}_down_{{ run_ts }}.csv"
    csv_column: "maintask_{{ inventory_hostname }}_down_{{ run_ts }}"
    results_list: "{{ snap.stdout }}"
  import_tasks: "../../../common_csv/tasks/append_phase_csv.yml"
