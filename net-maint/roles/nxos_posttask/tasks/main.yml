---
- name: Build NX-OS POSTTASK commands
  ansible.builtin.set_fact:
    commands: >-
      {{
        nxos_check_cmds_common
        + (nxos_check_cmds_vpc  if inventory_hostname in (nxos_hosts_vpc_hsrp_ospf + nxos_hosts_vpc_only) else [])
        + (nxos_check_cmds_hsrp if inventory_hostname in (nxos_hosts_vpc_hsrp_ospf + nxos_hosts_hsrp_only) else [])
        + (nxos_check_cmds_ospf if inventory_hostname in (nxos_hosts_vpc_hsrp_ospf + nxos_hosts_ospf_only) else [])
      }}

- name: Run NX-OS POSTTASK commands
  cisco.nxos.nxos_command:
    commands: "{{ commands }}"
  register: post

- name: Write NX-OS POSTTASK CSV
  vars:
    csv_file: "{{ snapshot_dir }}/posttask_{{ run_ts }}.csv"
    csv_column: "posttask_{{ run_ts }}"
    results_list: "{{ post.stdout }}"
  import_tasks: "../../common_csv/tasks/append_phase_csv.yml"
