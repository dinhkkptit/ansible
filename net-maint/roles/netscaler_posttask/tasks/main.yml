---
- name: NetScaler prep (disable paging)
  ansible.netcommon.cli_command:
    command: "{{ item }}"
  loop: "{{ netscaler_cli_prep }}"

- name: Build NetScaler POSTTASK commands
  ansible.builtin.set_fact:
    commands: "{{ netscaler_check_cmds }}"

- name: Run NetScaler POSTTASK commands (one by one)
  ansible.netcommon.cli_command:
    command: "{{ item }}"
  loop: "{{ commands }}"
  register: post

- name: Write NetScaler POSTTASK CSV
  vars:
    csv_file: "{{ snapshot_dir }}/posttask_{{ run_ts }}.csv"
    csv_column: "posttask_{{ run_ts }}"
    results_list: "{{ post.results | map(attribute='stdout') | list }}"
  import_tasks: "../../common_csv/tasks/append_phase_csv.yml"
