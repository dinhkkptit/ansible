---
- name: Ensure SQL log directory exists
  ansible.windows.win_file:
    path: "{{ sql_patch_log_dir }}"
    state: directory

- name: Ensure scripts directory exists
  ansible.windows.win_file:
    path: "{{ scripts_dir }}"
    state: directory

- name: Split SQL patches into SP and CU
  ansible.builtin.set_fact:
    sql_sp_patches: "{{ sql_patches | select('search', 'SP') | list }}"
    sql_cu_patches: "{{ sql_patches | reject('search', 'SP') | list }}"

- name: Deploy SQL SP runner script
  when: sql_sp_patches | length > 0
  ansible.windows.win_copy:
    dest: "{{ scripts_dir }}\\SQL_SP_Runner.ps1"
    content: "{{ lookup('template', 'sql_sp_runner.ps1.j2') }}"

- name: Deploy SQL CU runner script
  when: sql_cu_patches | length > 0
  ansible.windows.win_copy:
    dest: "{{ scripts_dir }}\\SQL_CU_Runner.ps1"
    content: "{{ lookup('template', 'sql_cu_runner.ps1.j2') }}"

- name: Create SQL SP scheduled task
  when: sql_sp_patches | length > 0
  ansible.windows.win_scheduled_task:
    name: "SQL_SP_Task"
    actions:
      - path: powershell.exe
        arguments: "-NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File {{ scripts_dir }}\\SQL_SP_Runner.ps1"
    triggers:
      - type: once
        start_boundary: "{{ ansible_date_time.iso8601 }}"
    run_level: highest
    state: present

- name: Start SQL SP task
  when: sql_sp_patches | length > 0
  ansible.windows.win_shell: "Start-ScheduledTask -TaskName 'SQL_SP_Task'"
  async: 1
  poll: 0

- name: Wait for SQL SP to complete
  when: sql_sp_patches | length > 0
  ansible.windows.win_shell: |
    $taskInfo = Get-ScheduledTaskInfo -TaskName 'SQL_SP_Task'
    if ($taskInfo.LastTaskResult -eq 0 -and $taskInfo.LastRunTime -ne $null) { exit 0 } else { exit 1 }
  register: sql_sp_status
  retries: 240
  delay: 30
  until: sql_sp_status.rc == 0

- name: Create SQL CU scheduled task
  when: sql_cu_patches | length > 0
  ansible.windows.win_scheduled_task:
    name: "SQL_CU_Task"
    actions:
      - path: powershell.exe
        arguments: "-NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File {{ scripts_dir }}\\SQL_CU_Runner.ps1"
    triggers:
      - type: once
        start_boundary: "{{ ansible_date_time.iso8601 }}"
    run_level: highest
    state: present

- name: Start SQL CU task
  when: sql_cu_patches | length > 0
  ansible.windows.win_shell: "Start-ScheduledTask -TaskName 'SQL_CU_Task'"
  async: 1
  poll: 0

- name: Wait for SQL CU to complete
  when: sql_cu_patches | length > 0
  ansible.windows.win_shell: |
    $taskInfo = Get-ScheduledTaskInfo -TaskName 'SQL_CU_Task'
    if ($taskInfo.LastTaskResult -eq 0 -and $taskInfo.LastRunTime -ne $null) { exit 0 } else { exit 1 }
  register: sql_cu_status
  retries: 240
  delay: 30
  until: sql_cu_status.rc == 0
